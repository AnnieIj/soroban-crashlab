version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 10
    reviewers:
      - "soroban-crashlab/maintainers"
    assignees:
      - "soroban-crashlab/maintainers"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "jest*"
          - "vitest*"
          - "ts-*"
          - "typescript"
          - "tailwindcss*"
          - "@tailwindcss/*"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "zod"
          - "@sentry/*"
          - "recharts"
          - "react-markdown"
          - "remark-gfm"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "npm"
      - "web"
    open-pull-requests-limit: 10
    reviewers:
      - "soroban-crashlab/maintainers"
    assignees:
      - "soroban-crashlab/maintainers"
    commit-message:
      prefix: "deps(web)"
      prefix-development: "deps-dev(web)"
      include: "scope"
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "jest*"
          - "vitest*"
          - "ts-*"
          - "typescript"
          - "tailwindcss*"
          - "@tailwindcss/*"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "zod"
          - "@sentry/*"
          - "recharts"
          - "react-markdown"
          - "remark-gfm"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/contracts/crashlab-core"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "cargo"
      - "crashlab-core"
    open-pull-requests-limit: 10
    reviewers:
      - "soroban-crashlab/maintainers"
    assignees:
      - "soroban-crashlab/maintainers"
    commit-message:
      prefix: "deps(core)"
      include: "scope"

  - package-ecosystem: "cargo"
    directory: "/contracts/soroban-example"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "cargo"
      - "soroban-example"
    open-pull-requests-limit: 10
    reviewers:
      - "soroban-crashlab/maintainers"
    assignees:
      - "soroban-crashlab/maintainers"
    commit-message:
      prefix: "deps(soroban)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
    reviewers:
      - "soroban-crashlab/maintainers"
    assignees:
      - "soroban-crashlab/maintainers"
    commit-message:
      prefix: "ci"
      include: "scope"