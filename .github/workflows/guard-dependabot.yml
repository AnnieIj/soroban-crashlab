name: Guard external automation PRs

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  close-dependabot:
    runs-on: ubuntu-latest
    steps:
      - name: Close and lock Dependabot PRs
        if: github.actor == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$PR_NUMBER" --comment "Automated dependency update PRs are disabled on this repository. Dependency upgrades are handled manually by maintainers so each bump is reviewed against the full lint, build, test, and e2e suite before landing." --delete-branch
